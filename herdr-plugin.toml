id = "herdr-jmpr"
name = "jmpr"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Jump to project workspaces ranked by zsh-z frecency"
platforms = ["linux", "macos"]

[[build]]
command = ["uv", "sync", "--frozen"]

[[startup]]
command = ["uv", "sync", "--frozen"]

[[actions]]
id = "jump"
title = "Jump to project workspace…"
contexts = ["pane", "tab", "workspace", "global"]
command = ["bin/herdr-jmpr", "open-picker"]

[[actions]]
id = "move-pane"
title = "Move pane to project workspace…"
contexts = ["pane", "tab", "workspace", "global"]
command = ["bin/herdr-jmpr", "open-picker", "--move-pane"]

[[actions]]
id = "move-tab"
title = "Move tab to project workspace…"
contexts = ["pane", "tab", "workspace", "global"]
command = ["bin/herdr-jmpr", "open-picker", "--move-tab"]

[[actions]]
id = "jump-all"
title = "Jump to directory (all zsh-z)…"
contexts = ["pane", "tab", "workspace", "global"]
command = ["bin/herdr-jmpr", "open-picker", "--all"]

[[panes]]
id = "jump"
title = "jmpr"
placement = "popup"
width = "80%"
height = "80%"
command = ["bin/herdr-jmpr"]

[[panes]]
id = "move-pane"
title = "jmpr: move pane"
placement = "popup"
width = "80%"
height = "80%"
command = ["bin/herdr-jmpr", "--move-pane"]

[[panes]]
id = "move-tab"
title = "jmpr: move tab"
placement = "popup"
width = "80%"
height = "80%"
command = ["bin/herdr-jmpr", "--move-tab"]

[[panes]]
id = "jump-all"
title = "jmpr: all dirs"
placement = "popup"
width = "80%"
height = "80%"
command = ["bin/herdr-jmpr", "--all"]
