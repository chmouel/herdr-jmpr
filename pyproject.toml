[project]
name = "herdr-jmpr"
version = "0.1.0"
description = "Herdr plugin: jump to project workspaces ranked by zsh-z or zoxide frecency"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Chmouel Boudjnah" }]
keywords = ["herdr", "zsh-z", "zoxide", "workspace", "tui", "textual", "frecency"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/chmouel/herdr-jmpr"
Repository = "https://github.com/chmouel/herdr-jmpr"
Issues = "https://github.com/chmouel/herdr-jmpr/issues"
dependencies = [
    "textual>=0.85.0",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
