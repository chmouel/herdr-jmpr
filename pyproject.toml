[project]
name = "herdr-zshz"
version = "0.1.0"
description = "Herdr plugin: jump to project workspaces ranked by zsh-z frecency"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Chmouel Boudjnah" }]
dependencies = ["textual>=0.85.0"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
